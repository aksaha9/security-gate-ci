[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_gate"]

[project]
name = "sec-gate"
version = "0.1.0"
description = "Pluggable CI/CD security compliance gate wrapping MongoDB Kingfisher and SAST analyzers"
license = "MIT"
authors = [{ name = "Ashish Kumar Saha", email = "aksaha9@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0.2,<7",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/aksaha9/security-gate-ci"
Repository = "https://github.com/aksaha9/security-gate-ci"
Documentation = "https://github.com/aksaha9/security-gate-ci/blob/main/HOWTO.md"

[project.scripts]
sec-gate = "sec_gate.cli:app"

[project.entry-points."sec_gate.plugins"]
kingfisher = "sec_gate.plugins.kingfisher:KingfisherPlugin"
injection = "sec_gate.plugins.injection:InjectionPlugin"
